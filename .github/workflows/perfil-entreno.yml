name: Perfil del entrenador (temporal)
# TEMPORAL (rama prueba-windows): ¿por qué el entrenamiento va tan lento en el runner de Windows? 60 s de live_train
# (modelo de prueba desde cero, nivel 19) con cProfile, en Windows y en Linux para comparar. Se borra al terminar.
on: workflow_dispatch
permissions:
  contents: read
jobs:
  perfil:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - shell: bash
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy gymnasium stable-baselines3
      - shell: bash
        run: |
          nproc 2>/dev/null || echo "NUMBER_OF_PROCESSORS=$NUMBER_OF_PROCESSORS"
          python -c "import torch;print('torch',torch.__version__,'threads',torch.get_num_threads(),'interop',torch.get_num_interop_threads())"
          mkdir -p tmpm
          cat > perfil.py <<'PY'
          import cProfile, pstats, runpy, socket, sys, threading, time, json
          def parar():
              time.sleep(float(sys.argv[1]))
              s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM); s.sendto(b'{"stop": true}', ("127.0.0.1", 9132))
          threading.Thread(target=parar, daemon=True).start()
          sys.argv = ["scripts/live_train.py", "--model", "tmpm/modelo.zip", "--estado", "tmpm/entrenando.json", "--speed", "rapido",
                      "--stage", "19", "--drones", "16", "--port", "9131", "--ctrl-port", "9132"] + sys.argv[2:]
          t0 = time.time()
          pr = cProfile.Profile(); pr.enable()
          try:
              runpy.run_path("scripts/live_train.py", run_name="__main__")
          except SystemExit:
              pass
          pr.disable()
          e = json.load(open("tmpm/entrenando.json"))
          print("PASOS", e.get("steps"), "GEN", e.get("gen"), "en", round(time.time() - t0), "s")
          pstats.Stats(pr).sort_stats("tottime").print_stats(25)
          PY
          python perfil.py 60 2>&1 | grep -v "^$" | tail -60
