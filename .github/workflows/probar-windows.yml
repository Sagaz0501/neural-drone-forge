name: Probar Windows

# LA PRUEBA DEL .EXE EN UN WINDOWS DE VERDAD (nadie del equipo tiene un PC con Windows): arma el instalador igual que
# instaladores.yml, lo instala sin preguntas (NSIS /S), abre la app con DRONMAKER_PRUEBA=1 (desktop/main.js: sin
# diálogos, el log del servidor y prueba.json) y revisa: el juego y la API responden, un entrenamiento corto en el fondo
# (unos segundos, nivel 19, un modelo de prueba que se borra con el runner), /api/evaluar, que el entrenamiento siga al
# cerrar la app y se encuentre al abrirla, la actualización sin reinstalar (un .tar.gz de actualizacion.sh servido en
# local), que al cerrar no queden servidor.exe huérfanos y desinstalar. Capturas + logs + resultados.json = artefacto.
# Script: desktop/probar_windows.ps1. Resultados y lo que falta: docs/WINDOWS.md. NO sube nada a ningún release.
on:
  workflow_dispatch:
  push:
    branches: [prueba-windows]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Dependencias del servidor (PyTorch solo CPU) + PyInstaller
        shell: bash
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy gymnasium stable-baselines3 "pyinstaller>=6.10"
      - name: Electron
        working-directory: desktop
        run: npm ci
      - name: Empaquetar (igual que instaladores.yml)
        shell: bash
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: PY=python sh empaquetar.sh
      - name: Una actualización de prueba (9.9.9) con actualizacion.sh
        shell: bash
        working-directory: desktop
        run: |
          cp package.json ../package.json.bak
          node -e 'const f="package.json",p=require("./"+f);p.version="9.9.9";require("fs").writeFileSync(f,JSON.stringify(p,null,2)+"\n")'
          sh actualizacion.sh
          mv ../package.json.bak package.json
          mkdir -p ../actualizacion_prueba && mv dist/juego-9.9.9.tar.gz dist/actualizacion.json ../actualizacion_prueba/
      - name: Instalar, abrir y probar
        shell: pwsh
        run: ./desktop/probar_windows.ps1 -Instalador (Get-ChildItem desktop/dist/*.exe | Select-Object -First 1).FullName -Actualizacion "$PWD/actualizacion_prueba"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prueba-windows
          path: prueba/
          if-no-files-found: warn
