name: Instaladores

# Los instaladores de la app (desktop/empaquetar.sh): el .exe de Windows y el .dmg de Mac (Apple Silicon), sin firmar.
# Se corre a mano (Actions -> Instaladores -> Run workflow) o al subir un tag v*. Quedan como artefactos del run.
# Con un tag v*: el job de Mac sube al release (lo crea si no existe) el .dmg + la actualización del juego
# (juego-<versión>.tar.gz + actualizacion.json, desktop/actualizacion.sh): las apps instaladas se actualizan solas.
# El .exe queda como artefacto hasta probarlo en un Windows. El tag tiene que ser la versión de desktop/package.json.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  instalador:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Dependencias del servidor (PyTorch solo CPU) + PyInstaller
        shell: bash
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy gymnasium stable-baselines3 "pyinstaller>=6.10"
      - name: Electron
        working-directory: desktop
        run: npm ci
      - name: Empaquetar
        shell: bash
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: PY=python sh empaquetar.sh
      - uses: actions/upload-artifact@v4
        with:
          name: neural-drone-forge-${{ matrix.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
          if-no-files-found: error
      - name: El tag es la versión de package.json
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'macOS'
        shell: bash
        run: test "v$(node -p 'require("./desktop/package.json").version')" = "${{ github.ref_name }}"
      - name: La actualización del juego (sin reinstalar)
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'macOS'
        working-directory: desktop
        run: sh actualizacion.sh
      - name: Subir al release
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'macOS'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          T="${{ github.ref_name }}"
          gh release view "$T" >/dev/null 2>&1 || gh release create "$T" --title "Neural Drone Forge $T" --notes "Ver CHANGELOG.md"
          gh release upload "$T" desktop/dist/Neural-Drone-Forge-mac.dmg desktop/dist/juego-*.tar.gz desktop/dist/actualizacion.json --clobber
