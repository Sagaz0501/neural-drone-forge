name: Instaladores

# Los instaladores de la app (desktop/empaquetar.sh): el .exe de Windows y el .dmg de Mac (Apple Silicon), sin firmar.
# Se corre a mano (Actions -> Instaladores -> Run workflow) o al subir un tag v*. Quedan como artefactos del run.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  instalador:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Dependencias del servidor (PyTorch solo CPU) + PyInstaller
        shell: bash
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy gymnasium stable-baselines3 "pyinstaller>=6.10"
      - name: Electron
        working-directory: desktop
        run: npm ci
      - name: Empaquetar
        shell: bash
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: PY=python sh empaquetar.sh
      - uses: actions/upload-artifact@v4
        with:
          name: neural-drone-forge-${{ matrix.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
          if-no-files-found: error
